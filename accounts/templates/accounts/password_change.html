{% extends 'core/base.html' %}

{% block content %}
<div class="welcome-card-blog4">
    <h2 class="titulo-productos">Cambiar Contraseña.</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn-list">Guardar nueva contraseña!</button>
    </form>
    
    <br>
    <a href="{% url 'accounts:profile' %}" class="btn-list" style="background-color: red;">Cancelar</a>
</div>
{% endblock %}
